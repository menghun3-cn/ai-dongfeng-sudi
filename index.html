<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东风速递导弹 3C - 全球打击演练</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05080a;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    color: #cfe8d0;
    user-select: none;
  }

  #app {
    display: flex;
    width: 100%; height: 100%;
  }

  /* ---------- 左侧控制面板 ---------- */
  #panel {
    width: 340px;
    min-width: 340px;
    height: 100%;
    background: linear-gradient(180deg, #0b1f14 0%, #07130d 100%);
    border-right: 2px solid #1d5c33;
    display: flex;
    flex-direction: column;
    z-index: 10;
    box-shadow: 4px 0 24px rgba(0,0,0,.55);
  }

  .panel-head {
    padding: 18px 16px 14px;
    border-bottom: 1px solid #1d5c33;
    text-align: center;
    background: linear-gradient(180deg, rgba(45,120,70,.18), transparent);
  }
  .panel-head h1 {
    font-size: 26px;
    letter-spacing: 6px;
    color: #7dffa8;
    text-shadow: 0 0 12px rgba(80,255,140,.55);
    font-weight: 800;
  }
  .panel-head .sub {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 3px;
    color: #5e9a72;
  }

  .sec {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(29,92,51,.5);
  }
  .sec-title {
    font-size: 13px;
    color: #7dffa8;
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sec-title::before {
    content: "▍";
    color: #ffc24d;
  }

  /* 状态区 */
  #statusWrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #statusText {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #7dffa8;
  }
  #statusText.warn { color: #ffc24d; }
  #statusText.fire { color: #ff5b5b; }
  #countdown {
    font-size: 34px;
    font-weight: 900;
    color: #ffc24d;
    font-family: Consolas, monospace;
    text-shadow: 0 0 16px rgba(255,194,77,.7);
    min-width: 52px;
    text-align: center;
  }

  /* 目标坐标 */
  .coord-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .coord-row label {
    width: 52px;
    font-size: 13px;
    color: #8fd8a2;
    letter-spacing: 1px;
  }
  .coord-row input {
    flex: 1;
    padding: 7px 10px;
    background: #04110a;
    border: 1px solid #1d5c33;
    border-radius: 4px;
    color: #c9f7d4;
    font-size: 15px;
    font-family: Consolas, monospace;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .coord-row input:focus {
    border-color: #3fd674;
    box-shadow: 0 0 8px rgba(63,214,116,.35);
  }
  .coord-row .unit { color: #5e9a72; font-size: 12px; }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 5px;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 2px;
    transition: transform .08s, filter .15s, background .15s;
  }
  button:active { transform: translateY(1px) scale(.98); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  #btnRandom {
    flex: 1;
    padding: 9px 0;
    background: #123a22;
    color: #9be8ae;
    border: 1px solid #1d5c33;
    font-size: 14px;
  }
  #btnRandom:hover:not(:disabled) { background: #1a5230; }

  #btnLaunch {
    width: 100%;
    padding: 13px 0;
    margin-top: 10px;
    background: linear-gradient(180deg, #e0473a, #a51f13);
    color: #ffe9e6;
    font-size: 19px;
    letter-spacing: 8px;
    text-shadow: 0 1px 2px rgba(0,0,0,.5);
    box-shadow: 0 0 18px rgba(255,70,50,.25), inset 0 1px 0 rgba(255,255,255,.18);
  }
  #btnLaunch:hover:not(:disabled) {
    filter: brightness(1.15);
    box-shadow: 0 0 26px rgba(255,70,50,.5), inset 0 1px 0 rgba(255,255,255,.18);
  }

  /* 战绩 */
  .score-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .score-box {
    background: #04110a;
    border: 1px solid #1d5c33;
    border-radius: 5px;
    padding: 9px 6px;
    text-align: center;
  }
  .score-box .k { font-size: 11px; color: #5e9a72; letter-spacing: 2px; }
  .score-box .v {
    font-size: 26px;
    font-weight: 900;
    color: #7dffa8;
    font-family: Consolas, monospace;
    margin-top: 3px;
  }

  /* 打击记录 */
  #logList {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 10px;
    font-size: 12px;
    color: #7fb98c;
    line-height: 1.9;
  }
  #logList::-webkit-scrollbar { width: 5px; }
  #logList::-webkit-scrollbar-thumb { background: #1d5c33; border-radius: 3px; }
  #logList .log-hit { color: #ffc24d; }
  #logList .log-miss { color: #a06a6a; }
  #logList .log-empty { color: #3d6b4c; font-style: italic; }

  .panel-foot {
    padding: 8px 16px;
    border-top: 1px solid #1d5c33;
    font-size: 11px;
    color: #3d6b4c;
    letter-spacing: 1px;
  }
  .panel-foot b { color: #6fae83; }

  /* ---------- 右侧 3D 场景 ---------- */
  #sceneWrap {
    flex: 1;
    position: relative;
    min-width: 0;
  }
  #sceneWrap canvas { display: block; }

  /* 命中飘分 */
  #floatScore {
    position: absolute;
    pointer-events: none;
    font-size: 30px;
    font-weight: 900;
    color: #ffd23d;
    text-shadow: 0 0 18px rgba(255,180,40,.9), 0 2px 4px rgba(0,0,0,.8);
    opacity: 0;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    transition: none;
    z-index: 20;
  }
  .float-anim {
    animation: floatUp 1.5s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, 0) scale(.6); }
    15%  { opacity: 1; transform: translate(-50%, -30px) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -110px) scale(1); }
  }

  /* 屏幕红光闪烁（爆炸时） */
  #flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(255,120,40,.0), rgba(255,60,20,.0));
    z-index: 15;
    opacity: 0;
  }
  .flash-anim { animation: flashAnim .7s ease-out forwards; }
  @keyframes flashAnim {
    0%   { opacity: 1; background: radial-gradient(circle at 50% 50%, rgba(255,200,120,.55), rgba(255,80,30,.45)); }
    100% { opacity: 0; }
  }

  /* 提示 */
  #hint {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 2px;
    color: rgba(150,220,170,.55);
    background: rgba(0,0,0,.35);
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid rgba(63,214,116,.2);
    pointer-events: none;
    z-index: 12;
  }

  /* 画中画（右下角横向跟踪镜头） */
  #pip {
    position: absolute;
    right: 12px; bottom: 12px;
    width: 300px; height: 168px;
    border: 2px solid rgba(63,214,116,.7);
    border-radius: 6px;
    overflow: hidden;
    background: rgba(0,0,0,.5);
    z-index: 18;
    box-shadow: 0 0 16px rgba(63,214,116,.25);
    pointer-events: none;
  }
  #pip canvas { width: 100%; height: 100%; display: block; }
  #pipLabel {
    position: absolute; top: 3px; left: 7px;
    font-size: 11px; letter-spacing: 1px;
    color: #7dffa8; text-shadow: 0 0 6px rgba(0,0,0,.9);
    pointer-events: none;
    z-index: 2;
  }

  /* 加载遮罩 */
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05080a;
    color: #7dffa8;
    font-size: 18px;
    letter-spacing: 4px;
    z-index: 30;
    transition: opacity .5s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }

  @media (max-width: 760px) {
    #panel { width: 260px; min-width: 260px; }
    .panel-head h1 { font-size: 19px; letter-spacing: 3px; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- 左侧控制面板 -->
  <aside id="panel">
    <div class="panel-head">
      <h1>东风速递导弹 3C</h1>
      <div class="sub">东风速递·真理</div>
    </div>

    <div class="sec">
      <div class="sec-title">系统状态</div>
      <div id="statusWrap">
        <span id="statusText">待命</span>
        <span id="countdown">--</span>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">击打坐标（可调整）</div>
      <div class="coord-row">
        <label>经度</label>
        <input id="inpLon" type="number" step="0.1" min="-180" max="180" value="139.7">
        <span class="unit">°E/W</span>
      </div>
      <div class="coord-row">
        <label>纬度</label>
        <input id="inpLat" type="number" step="0.1" min="-90" max="90" value="35.7">
        <span class="unit">°N/S</span>
      </div>
      <div class="btn-row">
        <button id="btnRandom">随机坐标</button>
      </div>
      <button id="btnLaunch" disabled>发 射</button>
    </div>

    <div class="sec">
      <div class="sec-title">打击战绩</div>
      <div class="score-grid">
        <div class="score-box"><div class="k">命中目标</div><div class="v" id="valHits">0</div></div>
        <div class="score-box"><div class="k">总得分</div><div class="v" id="valScore">0</div></div>
      </div>
    </div>

    <div class="sec" style="flex:1; display:flex; flex-direction:column; border-bottom:none;">
      <div class="sec-title">打击记录</div>
      <div id="logList"><div class="log-empty">— 暂无打击记录 —</div></div>
    </div>

    <div class="panel-foot">发射阵地：<b>五寨基地</b>（39.1°N / 111.8°E）· 观察红点位置，微调击打坐标精准命中</div>
  </aside>

  <!-- 右侧 3D 场景 -->
  <div id="sceneWrap">
    <div id="loading">正在加载全球态势…</div>
    <div id="floatScore">+100</div>
    <div id="flash"></div>
    <div id="pip"><div id="pipLabel">● 横向跟踪镜头 TRK-L</div></div>
    <div id="hint">左键拖动旋转 · 滚轮缩放 · 观察红点位置 · 输入击打坐标（误差 2° 内命中）</div>
  </div>
</div>

<script src="js/three.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
