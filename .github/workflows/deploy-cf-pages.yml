# 东风速递导弹 3C —— GitHub Actions 流水线
# 推送 main 分支或手动触发时，将静态站点部署到 Cloudflare Pages
# 项目不存在时会自动创建（无需手动到控制台建项目）
#
# 前置配置（仓库 Settings -> Secrets and variables -> Actions）：
#   Secrets:
#     CLOUDFLARE_API_TOKEN  - Cloudflare API Token（权限：Cloudflare Pages:Edit）
#     CLOUDFLARE_ACCOUNT_ID - Cloudflare 账户 ID
#   Variables:
#     CF_PAGES_PROJECT      - Cloudflare Pages 项目名（默认 dongfeng-express，可省略）

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    # 文档类改动不触发部署流水线
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - 'screenshot/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署到 Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'dongfeng-express' }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备部署目录（仅拷贝运行所需文件，排除 node_modules 等非运行资源）
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp -r js dist/
          cp -r assets dist/

      - name: 创建 Pages 项目（已存在则跳过，幂等）
        run: |
          npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main \
            || echo "项目已存在或创建失败，继续部署（若为权限错误，部署步骤会报出真实原因）"

      - name: 部署到 Cloudflare Pages
        run: npx --yes wrangler@3 pages deploy dist --project-name="$CF_PROJECT" --branch=main
